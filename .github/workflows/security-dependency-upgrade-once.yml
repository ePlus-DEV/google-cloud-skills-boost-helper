name: Apply dependency security patches once

on:
  push:
    branches:
      - security/dependency-audit-20261030

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: security/dependency-audit-20261030
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - name: Apply reviewed patched ranges
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='package.json';
          const p=JSON.parse(readFileSync(path,'utf8'));
          Object.assign(p.devDependencies, {
            'vite':'^8.3.5',
            'vitest':'^4.1.12',
            '@vitest/coverage-v8':'^4.1.12'
          });
          Object.assign(p.resolutions, {
            'shell-quote':'^1.9.0',
            'esbuild':'^0.28.1',
            'nanoid':'^3.3.18',
            'follow-redirects':'^1.16.1',
            'zod':'^4.6.6',
            'undici':'^7.30.1',
            're2js':'^2.8.7',
            'adm-zip':'^0.6.1',
            '@grpc/grpc-js':'^1.13.6'
          });
          writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Generate lockfile from npm registry
        run: yarn install --ignore-scripts --ignore-engines
      - name: Prepare WXT types
        run: yarn wxt prepare
      - name: Compile
        run: yarn compile --pretty false
      - name: Run tests
        run: yarn test:coverage
      - name: Build browser extension
        run: |
          yarn build
          yarn build:firefox
      - name: Commit manifest and resolved lockfile only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            echo "Dependency graph is already up to date."
            exit 0
          fi
          git commit -m "fix(security): patch known vulnerable dependencies"
          git push origin HEAD:refs/heads/security/dependency-audit-20261030
