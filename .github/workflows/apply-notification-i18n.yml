name: Apply notification locale keys

on:
  push:
    branches:
      - feat/changelog-notification-preferences
    paths:
      - .github/workflows/apply-notification-i18n.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/changelog-notification-preferences
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add locale messages and remove hardcoded translations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const translations = {
            ar: {
              title: 'الإشعارات',
              description: 'تحكّم في إشعارات التحديث وإشعارات المتصفح.'
            },
            de: {
              title: 'Benachrichtigungen',
              description: 'Steuere Update-Hinweise und Browser-Benachrichtigungen.'
            },
            en: {
              title: 'Notifications',
              description: 'Control update notices and browser notifications.'
            },
            es: {
              title: 'Notificaciones',
              description: 'Controla los avisos de actualización y las notificaciones del navegador.'
            },
            fr: {
              title: 'Notifications',
              description: 'Gérez les avis de mise à jour et les notifications du navigateur.'
            },
            hi: {
              title: 'सूचनाएँ',
              description: 'अपडेट सूचनाओं और ब्राउज़र सूचनाओं को नियंत्रित करें।'
            },
            it: {
              title: 'Notifiche',
              description: 'Gestisci gli avvisi di aggiornamento e le notifiche del browser.'
            },
            ja: {
              title: '通知',
              description: '更新のお知らせとブラウザ通知を管理します。'
            },
            ko: {
              title: '알림',
              description: '업데이트 안내와 브라우저 알림을 관리합니다.'
            },
            pt_BR: {
              title: 'Notificações',
              description: 'Controle avisos de atualização e notificações do navegador.'
            },
            ru: {
              title: 'Уведомления',
              description: 'Управляйте уведомлениями об обновлениях и уведомлениями браузера.'
            },
            vi: {
              title: 'Thông báo',
              description: 'Quản lý thông báo cập nhật và thông báo trình duyệt.'
            },
            zh_CN: {
              title: '通知',
              description: '管理更新提醒和浏览器通知。'
            }
          };

          for (const [locale, copy] of Object.entries(translations)) {
            const file = path.join('public', '_locales', locale, 'messages.json');
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.notificationsSectionTitle = { message: copy.title };
            json.notificationsSectionDescription = { message: copy.description };
            fs.writeFileSync(file, `${JSON.stringify(json, null, 2)}\n`);
          }

          const tsPath = 'entrypoints/options/notificationSettings.ts';
          let source = fs.readFileSync(tsPath, 'utf8');
          source = source.replace(
            /const NOTIFICATION_SECTION_COPY:[\s\S]*?^};\n\n/m,
            ''
          );
          source = source.replace(
            /function getNotificationSectionCopy\(\): \{[\s\S]*?^}\n\n/m,
            ''
          );
          source = source.replace(
            /  const sectionCopy = getNotificationSectionCopy\(\);\n/,
            ''
          );
          source = source.replace('${sectionCopy.title}', '${getMessage("notificationsSectionTitle")}');
          source = source.replace('${sectionCopy.description}', '${getMessage("notificationsSectionDescription")}');
          fs.writeFileSync(tsPath, source);

          for (const locale of Object.keys(translations)) {
            const file = path.join('public', '_locales', locale, 'messages.json');
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!json.notificationsSectionTitle?.message || !json.notificationsSectionDescription?.message) {
              throw new Error(`Missing notification locale keys in ${locale}`);
            }
          }

          const finalSource = fs.readFileSync(tsPath, 'utf8');
          if (finalSource.includes('NOTIFICATION_SECTION_COPY') || finalSource.includes('getNotificationSectionCopy')) {
            throw new Error('Hardcoded notification translations were not fully removed');
          }
          NODE

      - name: Commit generated locale updates
        shell: bash
        run: |
          rm .github/workflows/apply-notification-i18n.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/_locales entrypoints/options/notificationSettings.ts .github/workflows/apply-notification-i18n.yml
          git commit -m "fix(i18n): localize notification section via locale files"
          git push origin HEAD:feat/changelog-notification-preferences
