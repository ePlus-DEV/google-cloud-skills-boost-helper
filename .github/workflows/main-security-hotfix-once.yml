name: Prepare main security dependency hotfix once

on:
  push:
    branches: [security/main-dependency-hotfix-20261030]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: security/main-dependency-hotfix-20261030
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: yarn
      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22
      - name: Update only security-related package constraints
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='package.json';
          const p=JSON.parse(readFileSync(path,'utf8'));
          if(p.version!=='1.3.4') throw new Error('Refuse to modify a release version other than main 1.3.4');
          Object.assign(p.devDependencies,{
            vite:'^8.3.5',
            vitest:'^4.1.12',
            '@vitest/coverage-v8':'^4.1.12',
          });
          Object.assign(p.resolutions,{
            vite:'8.3.5',
            'shell-quote':'^1.9.0',
            esbuild:'^0.28.1',
            nanoid:'^3.3.18',
            'follow-redirects':'^1.16.1',
            zod:'^4.6.6',
            undici:'^7.30.1',
            re2js:'^2.8.7',
            'adm-zip':'^0.6.1',
            '@grpc/grpc-js':'^1.13.6',
          });
          writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          NODE
      - name: Generate exact patched Yarn 1 lockfile
        run: yarn install --force --ignore-scripts --ignore-engines
      - name: Prepare WXT types
        run: yarn wxt prepare
      - name: Compile TypeScript
        run: yarn compile --pretty false
      - name: Test with coverage
        run: yarn test:coverage
      - name: Build Chrome and Firefox
        run: |
          yarn build
          yarn build:firefox
      - name: Audit security fixes
        shell: bash
        run: |
          set -uo pipefail
          yarn audit --json --level low > "${RUNNER_TEMP}/security-audit.jsonl" 2>&1 || true
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const rows=readFileSync(process.env.RUNNER_TEMP+'/security-audit.jsonl','utf8')
            .split(/\r?\n/u).filter(Boolean).flatMap(line=>{
              try{return [JSON.parse(line)];}catch{return [];}
            });
          const summary=rows.find(x=>x.type==='auditSummary')?.data;
          const advisories=rows.filter(x=>x.type==='auditAdvisory')
            .map(x=>x.data?.advisory).filter(Boolean);
          const unique=[...new Map(advisories.map(a=>[String(a.id)+':'+a.module_name,a])).values()];
          const lines=['## Main-only dependency security patch','',
            '| Package | Severity | Advisory | Patched versions |',
            '|---|---|---|---|',
            ...unique.map(a=>`| ${a.module_name} | ${a.severity} | ${a.github_advisory_id||a.id} | ${a.patched_versions||'-'} |`),
            '', 'Summary: '+JSON.stringify(summary?.vulnerabilities||{})];
          console.log(lines.join('\n'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          const unresolved=unique.filter(a=>a.module_name!=='node-forge');
          if(!summary||unresolved.length){
            console.error('Security audit is missing or contains unapproved remaining vulnerabilities');
            process.exit(1);
          }
          NODE
      - name: Commit only security package updates
        shell: bash
        run: |
          set -euo pipefail
          node -e 'if(require("./package.json").version!=="1.3.4") process.exit(1)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit'
            exit 1
          fi
          git commit -m 'fix(security): patch main branch dependencies without release bump'
          git push origin HEAD:refs/heads/security/main-dependency-hotfix-20261030
