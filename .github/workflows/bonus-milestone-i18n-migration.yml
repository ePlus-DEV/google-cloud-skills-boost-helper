name: Bonus Milestone i18n migration

on:
  push:
    branches:
      - fix/bonus-milestone-browser-i18n

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/bonus-milestone-browser-i18n
          fetch-depth: 0

      - name: Migrate translations into native locale catalogs
        run: node scripts/migrate-bonus-milestone-i18n.mjs

      - name: Commit locale catalogs
        shell: bash
        run: |
          if git diff --quiet -- public/_locales; then
            echo "No locale changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/_locales
          git commit -m "refactor: move Bonus Milestone copy to browser i18n"
          git push origin HEAD:fix/bonus-milestone-browser-i18n
